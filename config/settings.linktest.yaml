# Isolated config for linked-asset retrieval verification
llm:
  provider: "deepseek"
  model: "deepseek-chat"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ${DEEPSEEK_API_KEY}
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "ollama"
  model: "nomic-embed-text"
  dimensions: 768
  base_url: "http://localhost:11434"
  deployment_name: "nomic-embed-text"

vision_llm:
  enabled: false
  provider: "azure"
  model: "gpt-4o"
  azure_endpoint: ""
  deployment_name: "gpt-4o"
  api_version: "2024-02-15-preview"
  api_key: ${AZURE_OPENAI_API_KEY}
  max_image_size: 2048

vector_store:
  provider: "chroma"
  persist_directory: "${MODULAR_RAG_LINKTEST_DATA_DIR:-data/linktest}/chroma"
  collection_name: "knowledge_hub"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60
  reference_weight: 0.3

rerank:
  enabled: false
  provider: "none"
  model: "disabled"
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "${MODULAR_RAG_LINKTEST_DATA_DIR:-data/linktest}/traces/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 100
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
