# Modular RAG MCP Server - Configuration
# This is the main configuration file for the MCP Server.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "deepseek"  # Options: openai, azure, ollama, deepseek
  model: "deepseek-chat"
  deployment_name: ""
  azure_endpoint: ""  # Set your Azure OpenAI endpoint here
  api_version: ""
  api_key: ${DEEPSEEK_API_KEY}
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "ollama"  # Options: openai, azure, ollama
  model: "nomic-embed-text"
  dimensions: 768    # text-embedding-ada-002 固定维度 (不传递给API, 仅用于验证)
  base_url: "http://localhost:11434"
  # Azure-specific settings (if provider is azure):
  #azure_endpoint: ""  # Set your Azure OpenAI endpoint here
  deployment_name: "nomic-embed-text"
  #api_version: "2024-02-15-preview"
  # api_key: ${AZURE_OPENAI_API_KEY}
  # OpenAI-specific settings (if provider is openai):
  # api_key: ${OPENAI_API_KEY}

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: false  # Enable after configuring a supported vision provider
  provider: "azure"  # Options: azure
  model: "gpt-4o"
  # Azure-specific settings (if provider is azure):
  azure_endpoint: ""
  deployment_name: "gpt-4o"
  api_version: "2024-02-15-preview"
  api_key: ${AZURE_OPENAI_API_KEY}
  # Ollama-specific settings (if provider is ollama):
  # base_url: "http://localhost:11434"
  max_image_size: 2048  # Max dimension (width/height) for image compression

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "${MODULAR_RAG_DATA_DIR:-data}/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant
  reference_weight: 0.3  # 参考文献 chunk 召回降权系数 (0=排除, 1=不降权)
  candidate_multiplier: 2  # Rerank/范围过滤前的候选池倍率
  candidate_max: 100

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: true
  provider: "llm"  # Options: none, cross_encoder, llm
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5
  strategy: "replace"  # replace 保持旧行为；conservative 需评测后再启用
  rrf_weight: 0.5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: true
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "precision_at_k"
    - "recall_at_k"
    - "ndcg_at_k"
   # - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "${MODULAR_RAG_TRACE_DIR:-data/traces}/traces.jsonl"
  structured_logging: true
  include_content: false  # 默认 Trace 仅保存 ID/分数，不复制私有论文正文

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true   # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment

  hierarchical_chunking:
    enabled: false  # 新 collection 验证通过后再开启，避免与 v1 chunk schema 混写
    child_size: 350
    child_overlap: 50
    parent_size: 1200
    section_store_db: "${MODULAR_RAG_DATA_DIR:-data}/db/section_store.sqlite3"
    corpus_schema_version: "2.0"

# =============================================================================
# Optional Zotero source and Agent evidence handoff
# =============================================================================
sources:
  zotero:
    enabled: true
    base_url: "http://127.0.0.1:23119"
    request_timeout_seconds: 10
    read_only: true
    sync_state_db: "${MODULAR_RAG_DATA_DIR:-data}/state/zotero_sync.sqlite3"
    # 空列表表示信任 Zotero Local API 返回的本机附件路径；生产环境建议显式配置。
    allowed_attachment_roots: []

agent_handoff:
  enabled: false
  fulltext_provider: "zotero_plugin"
  global_reading_handoff: true
  low_coverage_handoff: true
  low_score_threshold: 0.01
  max_recommended_documents: 3

evidence:
  expand_context: "adaptive"
  include_score_breakdown: true
  include_zotero_identity: true
  require_source_locator: false
  max_context_characters: 6000
  deduplicate: false  # v2 评测通过后再开启 Parent 配额去重
