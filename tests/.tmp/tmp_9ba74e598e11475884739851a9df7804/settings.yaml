llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1024
embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
vector_store:
  provider: chroma
  persist_directory: C:/test_runtime/chroma
  collection_name: knowledge_hub
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60
  reference_weight: 0.3
rerank:
  enabled: false
  provider: none
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 5
evaluation:
  enabled: false
  provider: custom
  metrics:
    - hit_rate
    - mrr
observability:
  log_level: INFO
  trace_enabled: true
  trace_file: C:/test_runtime/traces/traces.jsonl
  structured_logging: true
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: recursive
  batch_size: 100
